<!DOCTYPE html>
<html lang="en">



<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF2 Class Inventory</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <input type="radio" name="class" id="spy" checked>
    <input type="radio" name="class" id="soldier">
    <input type="radio" name="class" id="scout">
    <input type="radio" name="class" id="sniper">

    <nav>

        <img src="./Assets/TF2_Logo.webp" alt="Team Fortress 2 Logo" class="logo">

        <div class="classButtons">
            <label for="spy">Spy</label>
            <label for="soldier">Soldier</label>
            <label for="scout">Scout</label>
            <label for="sniper">Sniper</label>
        </div>

    </nav>

    <div class="who">

        <h1 id="className"></h1>

    </div>

    <div class="inventory">

        <div class="SlotsGrid">

            <div class="slots" id="slot1">
                <img src="./assets/placeholder.webp" alt="Placeholder Image">
            </div>

            <div class="slots" id="slot2">
                <img src="./assets/placeholder.webp" alt="Placeholder Image">
            </div>

            <div class="slots" id="slot3">
                <img src="./assets/placeholder.webp" alt="Placeholder Image">
            </div>

            <div class="slots" id="slot4">
                <img src="./assets/placeholder.webp" alt="Placeholder Image">
            </div>

            <div class="slots" id="slot5">
                <img src="./assets/placeholder.webp" alt="Placeholder Image">
            </div>

            <div class="slots" id="slot6">
                <img src="./assets/placeholder.webp" alt="Placeholder Image">
            </div>
        
        </div>

        <div id="ClassFullBody">

            <img src="./assets/placeholder.webp">

        </div>

    </div>

</body>



</html>
