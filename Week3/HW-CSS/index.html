<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Homework Assignment: CSS</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..100,650..800');
    </style>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="card">
        
        <img class="card-pic" src="./Assets/Conniver_Kunai.png" alt="Conniver Kunai TF2" />

        <h1>Conniver Kunai</h1>

        <p id="item-level">
            Level 99 Kunai
        </p>

        <p id="item-ability">
            On Backstab: Absorbs the health from your victim
        </p>

        <p id="item-effects">
            -55 max health on wearer
        </p>

        <p id="item-description">
            Start off with low health      <br>
            Kill somebody with this knife  <br>
            Steal all of their health      <br>
        </p>

        <button class="card-button"
                onclick="window.open('https://wiki.teamfortress.com/wiki/Conniver_Kunai', '_blank')">
            Wiki
        </button>
        
    </div>
</body>



</html>
