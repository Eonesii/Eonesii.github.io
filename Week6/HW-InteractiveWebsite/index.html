
<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="displayColorButton">Dark Mode</button>

    <h1> Random Color Generator </h1>
    <p> Click 'Generate' to get a random color </p>

    <div id="colorBox">
        <p id="colorCode">#FFFFFF</p>
    </div>

    <div class="buttonContainer">
        <button id="generateButton">Generate</button>
        <button id="copyHexButton">Copy Hex</button>
        <button id="saveButton">Save Color</button>
    </div>

    <h2>Favorited Colors</h2>
    <div id="savedColors"></div>

    <script src="script.js"></script>
    
</body>



</html>
