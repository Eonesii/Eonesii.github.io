<!DOCTYPE html>

<html>



    <head>
        <title>... WEBPAGE WANTS TO BATTLE</title>
    </head>

    <body class="battle" style="background-color: bisque; font-family: monospace;">
        <h1 id="gengar">A WILD GENGAR APPEARS</h1>
        <section class="gengar">
            <img src="./Assets/gengar.png" aria-label="An image of Gengar from Pokemon"></img>
            <h3> 25/25 HP</h3>
        </section>

        <div style="background-color: green;"><p>&nbsp;</p></div>

        <section class="pikachu">
            <img src="./Assets/pikachu-back.png" aria-label="An image of Pikachu from Pokemon"></img>
            <ol>
                <li><button>Fight</button></li>

                <li>
                    <label id="item" for="item-select">Item</label>
                    <select id="item-select">
                        <option value="potion">Potion</option>
                        <option value="pokeball">Pokeball</option>
                    </select>
                </li>

                <li><button>Switch</button></li>
                
                <li><button>Run</button></li>
            </ol>
        </section>
    </body>



</html>
